name: sales-ai-crm
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_ai
      POSTGRES_USER: sales_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute INSTALAR.cmd para generar la configuracion}
    volumes:
      - sales_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_ai -d sales_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://sales_ai:${POSTGRES_PASSWORD}@postgres:5432/sales_ai?schema=public
      APP_SECRET: ${APP_SECRET:?Ejecute INSTALAR.cmd}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  sales_ai_postgres:
