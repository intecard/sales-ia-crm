name: INTECA - Community Manager Frequent Wake-up
on:
  schedule:
    # Every 15 minutes throughout the local publishing day (07:07-23:52 RD).
    # UTC-4 year-round; irregular minute avoids top-of-hour scheduled-run congestion.
    - cron: "7,22,37,52 11-23,0-3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inteca-community-production-wakeup
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the CRM and confirm its public health endpoint
        env:
          CRM_URL: https://sales.ia.crm.inteca.com.do
        shell: bash
        run: |
          set -euo pipefail
          # A GET wakes the existing Render Free web service. The CRM's own
          # communityManager.tick() safely publishes jobs due in its database.
          # Never publish directly from GitHub Actions or store API keys here.
          response="$(curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 100 \
            --retry 2 --retry-delay 12 --retry-connrefused \
            "${CRM_URL}/api/health")"
          printf '%s' "$response" | jq -e '.status=="ok" and .app=="Sales AI CRM"' >/dev/null
          echo "INTECA CRM responded to health check. Check the community calendar for actual publication results."
