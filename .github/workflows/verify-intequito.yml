name: Verify INTEQUITO CRM changes
on:
  pull_request:
    branches: [main, feat/intequito-community-daily-studio-20261027, feat/intequito-selfhosted-video-engine-20261027]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests for providers and calendar
        run: node --import tsx --test heygen-video-provider.test.ts community-manager.test.ts community-monthly-rotation.test.ts local-video-engine.test.ts
      - name: Test local GPU worker (no models downloaded)
        run: python3 -m unittest discover -s workers/intequito_local_video -p 'test_*.py'
