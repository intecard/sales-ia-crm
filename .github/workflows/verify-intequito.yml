name: Verify CRM and agents
on:
  pull_request:
    branches: [main, feat/intequito-community-daily-studio-20261027, feat/intequito-selfhosted-video-engine-20261027]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Functional tests for all CRM modules
        run: npm test
      - name: Compiled API authentication and payment gates
        run: node --test advertising-api.test.mjs sales-api.test.mjs whatsapp-webhook.test.mjs fiscal/api.test.mjs fiscal/reference.test.mjs
      - name: Test local GPU worker (no models downloaded)
        run: python3 -m unittest discover -s workers/intequito_local_video -p 'test_*.py'
