<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente comercial</title><style>body{font:14px system-ui;background:#f3f6fc;color:#17283f;margin:0;padding:18px}h1{font-size:19px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border:1px solid #c8d2e4;border-radius:10px;font:inherit}button{background:#4f46e5;color:white;cursor:pointer}button:disabled{opacity:.5}#messages p{white-space:pre-wrap;background:white;border-radius:10px;padding:12px}label{display:block;font-size:12px}input[type=checkbox]{width:auto}#error{color:#ae2642}a{color:#473fcd}img{width:180px;background:white;border-radius:8px}</style><img src="/logo-wide.png" alt="Sales AI CRM"><h1>Asistente virtual de ventas</h1><p>Consulta productos y precios con ayuda de IA. Puedes solicitar atención humana.</p><form id="chat"><input name="name" placeholder="Tu nombre" required maxlength="100"><input name="email" type="email" placeholder="Tu correo" required><label><input type="checkbox" name="consent" required>Acepto compartir mi nombre, correo y conversación con esta empresa para recibir atención comercial mediante IA.</label><div id="messages" aria-live="polite"></div><textarea name="message" placeholder="¿Qué necesitas?" required maxlength="2000"></textarea><button>Consultar</button></form><p id="error" role="alert"></p><div id="links"></div><script>
const query=new URLSearchParams(location.search),org=query.get('company'),key=query.get('key');let session;
const form=document.getElementById('chat'),messages=document.getElementById('messages'),error=document.getElementById('error');
function add(text){const p=document.createElement('p');p.textContent=text;messages.append(p);}
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;const data=Object.fromEntries(new FormData(form));try{const response=await fetch('/api/website/'+encodeURIComponent(org)+'/'+encodeURIComponent(key)+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,consent:true,session})});const result=await response.json();if(result.session)session=result.session;if(!response.ok)throw Error(result.error||'No disponible');add('Tú: '+data.message);add('Asistente IA: '+result.content);form.elements.message.value='';const links=document.getElementById('links');links.replaceChildren();if(result.checkoutUrl){const a=document.createElement('a');a.textContent='Ir al pago autorizado por la empresa';a.href=result.checkoutUrl;a.target='_blank';a.rel='noopener noreferrer';links.append(a);}if(result.handoffEmail){const p=document.createElement('p');p.textContent='Atención humana: '+result.handoffEmail;links.append(p);}}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});
</script></html>
