<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conectar Sales AI CRM</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #0b2340; background: #eef3f9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); background: white; border-radius: 24px; padding: 36px; box-shadow: 0 24px 80px #17345122; }
      img { width: 220px; max-height: 76px; object-fit: contain; object-position: left; }
      h1 { margin: 24px 0 8px; font-size: 30px; }
      p { color: #52708e; line-height: 1.55; }
      label { display: grid; gap: 8px; font-weight: 700; margin-top: 24px; }
      input { width: 100%; border: 1px solid #bfd0e1; border-radius: 12px; padding: 14px; font-size: 16px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
      button { border: 1px solid #bfd0e1; border-radius: 12px; padding: 12px 18px; background: white; font-weight: 700; cursor: pointer; }
      button.primary { color: white; border: 0; background: linear-gradient(135deg, #215bea, #7935eb); }
      #result { min-height: 28px; font-weight: 700; }
      small { display: block; margin-top: 18px; color: #607c98; }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/logo-wide.png" alt="Sales AI CRM" />
      <h1>Conectar esta computadora</h1>
      <p>Utiliza la dirección segura de tu empresa. Windows, Mac y la página web trabajarán con los mismos usuarios y datos.</p>
      <label>Dirección del servicio
        <input id="url" type="url" value="https://crm.sudominio.com" autocomplete="url" />
      </label>
      <div class="actions">
        <button id="local">Usar instalación local</button>
        <button id="test">Probar conexión</button>
        <button class="primary" id="connect">Guardar y conectar</button>
      </div>
      <p id="result" role="status"></p>
      <small>Por seguridad, se exige HTTPS. Solo localhost puede utilizar HTTP para una instalación local.</small>
    </main>
    <script>
      const input = document.querySelector('#url');
      const result = document.querySelector('#result');
      document.querySelector('#local').onclick = () => { input.value = 'http://localhost:3000'; };
      document.querySelector('#test').onclick = async () => {
        result.textContent = 'Probando…';
        const response = await window.crmDesktop.testConnection(input.value);
        result.textContent = response.success ? 'Conexión correcta.' : response.error;
      };
      document.querySelector('#connect').onclick = async () => {
        result.textContent = 'Comprobando…';
        const test = await window.crmDesktop.testConnection(input.value);
        if (!test.success) { result.textContent = test.error; return; }
        const saved = await window.crmDesktop.saveConnection(input.value);
        if (!saved.success) { result.textContent = saved.error; return; }
        location.href = saved.serviceUrl;
      };
    </script>
  </body>
</html>
